datasets: [cub]

n_trials_screen: 1
n_trials_qual: null  # {null, [int]} >= n_trials_screen; seeds each arm's best coord per dataset is topped up to in the qual phase; (null) no qual phase
trainval: false  # {true, false}; (true) after the qual phase, retrain each pick on the trainval partition up to its qual-selected checkpoint, one run per qual seed, saving the weights (needs n_trials_qual)

baseline_overrides: {}

ablation_arms:
  - - {loss.loss1.targ: mp, loss.loss1.infonce.tsm.type: linear, name: SupCon}
    - {loss.loss1.targ: phylo, loss.loss1.infonce.tsm.type: softmax, name: HCon}

hpo_coords:
  - - {lr.init: [6.0e-5]}
  - - {loss.logits.scale.init: [30]}

suffix: null  # {null, [str]}; no suffix if set to null
