datasets: [cub]

n_trials_screen: 2
n_trials_refine: 3  # {null, [int]} >= n_trials_screen; seeds each arm's best coord per dataset is topped up to in the refine phase; (null) no refine phase
trainval: true  # {true, false}; (true) after the refine phase, retrain each pick on the trainval partition up to its refine-selected checkpoint, one run per refine seed, saving the weights (needs n_trials_refine)

baseline_overrides: {}

ablation_arms:
  - - {loss.loss1.targ: mp, loss.loss1.xnce.tsm.type: linear, name: SupCon}
    - {loss.loss1.targ: phylo, loss.loss1.xnce.tsm.type: softmax, name: HCon}

hpo_coords:
  - - {lr.init: [6.0e-5, 6.0e-4]}
  - - {loss.logits.scale.init: [10, 30]}

suffix: null  # {null, [str]}; no suffix if set to null
