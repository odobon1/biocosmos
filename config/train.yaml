split: D10
train_pt: train  # {train, trainval}

n_epochs: null  # {null, [int]} > 0; Trial duration in train-set epochs (sample volume = n_epochs * epoch size, where
# epoch size is the batch-truncated train set floor(train_set_size / batch_size) * batch_size; (null) Resolved from
# config/dataset_specific.yaml as per the dataset being run on
chain_floor: 100_000  # {null, [int]}; Min samples per dataloader pass: when train set < chain_floor, each pass consumes
# ceil(chain_floor / train_set_size) permutations' worth of one continuous stream of full shuffled permutations of the
# train set (partial-batch permutation tails carry into the next pass rather than dropping), decoupling pass length
# (and max batch_size) from dataset size; epochs are credited per pass as ceil(consumed_samples / train_set_size);
# (null | train set >= chain_floor) One pass per epoch
n_chkpts: null  # {null, [int]} > 0; Number of train-time checkpoints/evals (final included, base excluded), evenly
# spaced every sample_volume / n_chkpts samples; (null) Resolved from config/dataset_specific.yaml as per the dataset
# being run on
batch_size: 2_048  # {16, 32, 64, 128, 256, 512, 1_024, 2_048, 4_096, 8_192, 16_384, 32_768}; pretrain batch size for 
# clip_vitb16 and siglip_vitb16 (and perhaps all) was 32k
dv_batching: false  # (true) Dorsal/ventral-homogeneous batch sampling (only applicable to lepid/nymph)

arch:  # Architecture
  model_type: bioclip  # {bioclip, clip_vitb16, siglip_vitb16}
  clip:  # CLIP-specific; Inert iff (arch.model_type: siglip_*)
    non_causal: false  # {true, false}; (true) Converts text encoder causal attention mask to non-causal (zeros on 
    # diagonal + lower triangle, -inf on upper --> all zeros); Base eval: the native causal mask is always restored 
    # (non_causal undone) so the shared base_eval_cache stays a stable pretrained-as-released reference
  siglip:  # SigLIP-specific; Inert iff (arch.model_type: clip_*, bioclip*)
    vis_proj_head: null  # {null, linear, mlp}; Vision projection head over the attention-pooled image representation; 
    # (null) No projection head; (linear) Linear(D->D); (mlp) GeLU-MLP(D->2*D->D); (linear | mlp) Randomly-initialized 
    # params added; Note: this head is always skipped for base model evaluation (headless pretrained output used) so 
    # the shared base_eval_cache stays head-/seed-invariant

dropout:  # Applies only to the vision tower
  patch_dropout: 0.0  # [0.0, 1.0); Fraction of image patches dropped each training step; (0.0) Disabled
  siglip:  # SigLIP-specific params; Inert iff (arch.model_type: [clip model])
    proj_head: 0.0  # [0.0, 1.0); Dropout on the vision projection head; (0.0) Disabled; Inert iff
    # (arch.siglip.vis_proj_head: null)
    stoch_depth: null  # {null, [0.0, 1.0)}; (null) Disabled; ([float]) Stochastic depth / drop-path rate

freeze:
  image: false  # {true, false}
  text: false  # {true, false}

htarg:  # Hierarchical target params
  kernel: laplace  # {bm, laplace, ou}; Phylo target kernel on the tree's Brownian-motion VCV C (C_ab = depth of MRCA(a, b),
  # C_aa = tip depth); (bm) Brownian kernel, cosine-normalized: C_ab / sqrt(C_aa * C_bb), the shared root-path length over
  # the tips' own depths (root-dependent; 0 for pairs splitting at the root); (laplace | ou) Q = exp(-beta * d / avg_dist)
  # over a root-independent tree metric d, avg_dist its batch-pair-probability-weighted mean: (laplace) d = sqrt(patristic
  # distance), the Brownian contrast SD (Laplace / exponential kernel on the Brownian embedding); (ou) d = patristic
  # distance (stationary Ornstein-Uhlenbeck tree covariance); Inert iff (loss1.targ != phylo AND loss2.targ != phylo)
  exp:  # Exp-decay kernel params; Inert iff (htarg.kernel: bm, or no phylo target active)
    beta: 1.0  # (0.0, inf); Sharpness: Q = exp(-beta * d / avg_dist), i.e. the beta: 1.0 kernel raised to the power beta;
    # larger --> faster decay (sharper targets); (1.0) The average sampled pair sits at e^-1
  shuffle: false  # {true, false}

loss:  # Loss params: one criterion over the blended target distribution Y = (1 - lambda) * Y1 + lambda * Y2, Yk the
# target distribution of target k (loss1 / loss2) under the criterion -- its target matrix Qk itself for the BCE
# family, Qk through its own target simplex mapping (lossk.infonce.tsm) for InfoNCE
  crit: infonce  # {infonce, bce, bif_bce}; note: Bifurcated BCE makes the loss reading x2, but other than that it reduces
  # to standard BCE (identical gradient flows) if no anchor-wise methods are applied
  sim: cos  # {cos, geo1, geo2}
  lambda: 0.0  # [0.0, 1.0]; loss2's share of the target blend; (0.0) loss1's target alone (loss2 inert); (1.0) loss2's
  # target alone (loss1 inert)
  blend_type: targ  # {targ, loss}; (targ) One loss against the blended target, L(Y); (loss) Blend of the per-target
  # losses, (1 - lambda) * L(Y1) + lambda * L(Y2) -- one criterion, sim and weighting config either way; on shared
  # logit scalars the loss is affine in the target, so the two coincide (value and gradients) unless a target-dependent
  # factor is on: focal / DSMR / targ_mass_neut then read each term's own target, and unitless rescales each term;
  # Inert iff (loss.lambda: 0.0 | 1.0) or none of (loss.unitless, focal, DSMR, targ_mass_neut, loss.logits.shared:
  # false) is live
  unitless: false  # {true, false}; (true) Rescale each loss term by its detached magnitude, L / L.detach() (bif_bce: by
  # L/2, its gradient-scale-equivalent value): a lone term reads a constant 1.0 (bif_bce 2.0), and under blend_type:
  # loss the terms are equalized to unit magnitude so lambda is loss2's share of the loss reading -- equivalently (with
  # target-independent weights) a target blend under lambda_eff = lambda * L1 / (lambda * L1 + (1 - lambda) * L2);
  # (false) Raw losses
  logits:
    shared: true  # {true, false}; (true) Both loss terms of a loss blend run on one set of logit scalars (scale +
    # bias); (false) Each term on its own pair (loss1: logit_scale / logit_bias, loss2: logit_scale2 / logit_bias2), so
    # each target's loss is scored on its own logits off the one sim matrix -- the pairs share every setting below
    # (the second starts as a copy of the first as initialized: same init, freeze, clamp, center, LR factor) and part
    # ways in training; the scale2 / bias2 curves track the second pair, while the logit-dependent batch diagnostics
    # (P histogram, InfoNCE dalpha / KL / alpha_req, logit grad-norm) read loss1's; Inert iff (loss.blend_type: targ)
    # or (loss.lambda: 0.0 | 1.0) -- a target blend or a lone target is one loss on one set of logits
    scalar_lr_factor: 100.0  # (0.0, inf); LR multiplier for the logit scalars (scale/bias) relative to
    # opt.lr.init (e.g. 10.0 -> x10 backbone LR); ratio held through warmup + cosine decay; scalars are
    # weight-decay-decoupled; (1.0) Backbone LR
    scale:  # logit scale (alpha = 1 / tau), the multiplier on sims; the learnable param (model.logit_scale) is log(alpha)
      init: null  # {null, [float]}; (null) Existing learnable param (or 0.0 non-learnable if non-existent);
      # ([float]) Override init (alpha, not its log); base: (siglip_vitb16: ~117.3), (clip_vitb16: ~100.0);
      # Increasing scale/alpha --> sharper, decreasing --> softer
      freeze: false  # {true, false}; (true) Non-learnable log-scale
      clamp: false  # {true, false}; (true) Cap logit scale at ln(100) before exp() so scale multiplier stays <= 100
      # (CLIP's stability cap; guards exp() overflow + bf16 quantization blowup) -- a held cap passes no gradient to
      # the log-scale (the alpha curve then sits at 100, the dlogalpha strips at zero); (false) Unbounded
    bce:  # Sigmoid/BCE-path logit params; Inert iff (loss.crit: infonce)
      center: null  # {null, sim, grad_proj, grad_proj2}; Make dL/dsim zero-sum; (null) Disabled; (sim) Center
      # scaled sims about their mean before bias -- changes the forward (batch-dependent operating-point shift);
      # (grad_proj) Forward untouched, backward-only global-mean projection of the gradient entering sim (scale AND bias
      # learn from raw BCE grads); (grad_proj2) Same but projected at the scaled sims (bias raw, scale projected);
      # Chunked path (hw.loss_chunk_size) reproduces full-batch centering exactly; (sim) under chunking requires
      # sim: cos (config error otherwise -- no closed-form global mean for geo); sensitive to mixed precision
      bias:
        init: null  # {null, pos_prevalence, [float]}; (null) Use base model bias (or 0.0 non-learnable if non-existent);
        # (pos_prevalence) log(p / (1 - p)), p the expected positive prevalence of the blended target matrix under the
        # loss's class-imbalance / DSMR / targ_mass_neut weighting (utils.loss.pos_prevalence; sp: 1/B), so the initial
        # sigmoid matches the target prior where scaled sims average to zero; requires a BCE-family crit; ([float])
        # Override init; base: (siglip_vitb16: -12.9324)
        freeze: false  # {true, false}; (true) Non-learnable bias
  bce:  # Inert iff (loss.crit != bif_bce)
    targ_mass_neut: false  # {true, false}; (true) Divide each anchor's row-summed loss by its (blended) target
    # (row) mass; anchor-wise, so bif_bce-only (no-op under sp targets, whose row mass is already 1: inert iff every
    # live target is sp)
  wting:
    cls_imb:  # Class-imbalance weighting params; Inert iff (cls_imb.type: null)
      type: null  # {null, inv_freq, class_bal}; (inv_freq) Inverse-frequency; (class_bal) Class-balanced;
      # (null) Disable class-imbalance weighting
      inv_freq:  # Inverse-frequency weighting params; Inert iff (cls_imb.type != inv_freq)
        gamma: 0.5  # (0.0, 1.0]; 1 / n_c^gamma; (1.0) Classic inverse-frequency; (0.5) Inverse-sqrt-frequency;
        # As gamma → 0.0, weights → uniform (no weighting)
      class_bal:  # Class-balanced weighting params; Inert iff (cls_imb.type != class_bal)
        beta: 0.9999  # [0.0, 1.0)
      norm: false  # {true, false}; Rescale the batch's class-imbalance weights to mean 1.0 (weighted loss
      # retains the unweighted scale batch-by-batch rather than in expectation, at the cost of a
      # batch-composition-dependent normalizer); Inert iff (loss.unitless: true)
    focal:  # Focal loss params; Inert if (focal.gamma: 0.0)
      gamma: 0.0  # [0.0, inf); Down-weights easy samples, larger gamma → stronger focus on hard cases; (0.0) Disable
      # focal loss (FL --> CE iff gamma = 0.0); Recommended: 1-2 for InfoNCE, 2 for BCE; (<1.0 | >3.0) May be unstable
    bce:  # BCE-specific weighting params; Inert iff (loss.crit: infonce)
      dsmr: false  # {true, false}; Dynamic similarity mass rebalancing

loss1:  # Primary target params; Inert iff (loss.lambda: 1.0)
  targ: mp  # {sp, mp, tax, phylo}
  infonce:  # Inert iff (loss.crit != infonce)
    tsm:  # Target Simplex Mapping
      type: linear  # {linear, softmax}
      # (linear) Linear mapping (intended for MP + HCon, linear mapping operation is a no-op for SP (applied regardless))
      # (softmax) Softmax mapping (intended for HCon), targets first scaled by x2 to make alpha_Q comparable to logits' alpha
      # i.e. target range --> similarity range
      sm_scale: pinned  # {pinned, pinned1, [float]}
      # (pinned) Target scale alpha_Q pinned to the logits' learnable logit-scale alpha = exp(logit_scale) (targs scaled by x2 first)
      # (pinned1) Same as pinned but without the x2 target scaling
      # ([float]) Fixed alpha_Q (non-learnable), set =0.5 for no target scaling; inert if (loss1.infonce.tsm.type: linear)

loss2:  # Secondary target params; Inert iff (loss.lambda: 0.0)
  targ: phylo  # {sp, mp, tax, phylo}
  infonce:
    tsm:
      type: softmax  # {linear, softmax}
      sm_scale: pinned  # {pinned, pinned1, [float]}

aug:  # Image augmentation
  rrcrop:  # Random resized crop
    scale_min: 0.9  # Down-scale wrt area, scale randomly picked from [scale_min, 1.0]; OpenCLIP default: [0.9, 1.0]
  hflip: false  # {true, false}; Horizontal flip w/ 50% probability
  cjit:  # Color jitter
    brightness: 0.1
    contrast: 0.2
    saturation: 0.1
    hue: 0.01
    prob: 0.0
  sharpness:
    factor: 1.333  # (1.0, inf); Sharpness range = [1.0 / factor, factor]; =1.0 --> no change, <1.0 --> reduces 
    # sharpness, >1.0 --> increases sharpness
    prob: 0.00
  gblur:  # Gaussian blur
    kernel_size: 3  # [odd int]
    sigma:
      min: 0.0
      max: 1.0
    prob: 0.00

text_template:
  train: train
  eval: sci  # Following BioCLIP eval protocol

opt:  # Optimization
  lr:  # Learning rate
    init: 2.0e-5
    decay_factor: null  # {null, [float]}; Cosine scheduler eta_min = lr.init * decay_factor; (null) Decay to 0.0
    warmup: 0.05  # [0.0, 1.0]; Linear LR warmup duration as a fraction of sample_volume (e.g. 0.02 -> 2% of sample_volume)
  wd: null  # {null, [float]}; Weight Decay; (null) Resolved from model-specific default hyperparam config
  beta1: 0.9  # CLIP paper recommends 0.9
  beta2: null  # {null, [float]}; (null) Resolved from model-specific default hyperparam config
  eps: 1.0e-6  # CLIP paper recommends 1.0e-6 (ViT)

dev:
  debug_mode: false  # {true, false}
  debug:  # Config overrides applied iff (dev.debug_mode: true)
    n_epochs: 1
    chain_floor: null
    n_chkpts: 1
    batch_size: 256
    opt.lr.warmup: 0.0
  reporting:
    batch_diagnostics:  # Per-batch train diagnostics, toggled per component; (false) Skip that component's
    # compute -- its log fields and learning-curve panels are omitted (loss/LR/logit-scalar curves and evals
    # unaffected)
      grad_norm_model: true  # {true, false}; Whole-model grad norm (model= in grad_norm.log + its curve panel)
      delta_norm_model: true  # {true, false}; ||delta theta|| update norm via pre-step param snapshot
      # (step= in grad_norm.log + its curve panel)
      emb_logit_grads: true  # {true, false}; Retained embedding/logit grads (img=/txt=/logit= in grad_norm.log;
      # no curve panel)
      sim_grad_sums: true  # {true, false}; Retained sim grads' full-batch sums (the sim-grad-sum curve strips;
      # no log fields)
      sim_targ_stats: true  # {true, false}; Batch sim/targ distribution stats (sim_targ.log + the S/P/Q
      # curve panels, the mean hard-pair similarity margin strips and, for InfoNCE losses, the alpha panels'
      # target bound lines, the logit-scale gradient decomposition and KL decomposition strips)
    learning_curves:
      hpsm:
        kappas: [0, 1, 10, 100, 1_000, 10_000, 100_000]  # hard-pair similarity margin plotted kappa values
        multimodal: false  # {true, false}
    logging: true
    plot_every: trial  # {chkpt, trial}; (chkpt) Render learning-curve plots at every checkpoint (incl. base);
    # (trial) Only at the final checkpoint
    eval:
      base_chkpt_sel: true  # {true, false}; (true) The base eval (checkpoint 0) is a checkpoint-selection candidate
      # like any other, so a coord can be scored at its untrained model in the stats tables/workbooks, and the
      # convergence plots draw the curves from checkpoint 0; (false) Selection runs over 1..n_chkpts
  kill_thresh: 0.2  # {null, (0.0, 1.0)}; Fraction of the training run at which a trial that has not improved on its
  # base model is killed: at the train-time eval nearest that fraction, rounded up (ceil(kill_thresh * n_chkpts)), if no
  # eval so far has beaten the base eval's Composite-All Native mAP, the trial ends there and counts as complete --
  # scored at its own best checkpoint and shaded yellow in the stats tables (see README); (null) Never kill
  continue_campaign: true  # {true, false}; (true) Resume/extend an existing campaign of the same name; (false) If the
  # campaign name (incl. suffix) already has an artifacts dir, fall back to the first free <name>2, <name>3, ... Campaign
  # runner reads this flag from here (not from cfg_baseline.json)
  del_base_eval_cache: campaign  # {null, campaign, trial}; (campaign) Delete base_eval_cache/ once, when the campaign
  # is first created (relaunches keep the cache the campaign's own trials built); (trial) Delete it before each trial
  # launch, so every trial re-runs its base eval (apples-to-apples wall-clock comparisons); (null) Never delete it
