n_trials_screen: 3
n_trials_qual: null  # {null, [int]} >= n_trials_screen; seeds each arm's best coord per dataset is topped up to in the qual phase; (null) no qual phase
datasets: [nymph, lepid]

ablation_arms:
  - - {loss2.mix: 0.3, loss2.targ: phylo, htarg_shuf: true, name: shuffle}
    - {loss2.mix: 0.3, loss2.targ: phylo, htarg_shuf: false, name: no-shuffle}

hpo_coords:
  - - {name: base}

suffix: null  # {null, [str]}; no suffix if set to null
