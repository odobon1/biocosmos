datasets: [cub]

n_trials_screen: 1
n_trials_qual: 2  # {null, [int]} >= n_trials_screen; seeds each arm's best coord per dataset is topped up to in the qual phase; (null) no qual phase
trainval: true  # {true, false}; (true) after the qual phase, retrain each pick on the trainval partition up to its qual-selected checkpoint, one run per qual seed, saving the weights (needs n_trials_qual)

ablation_arms:
  - - {loss1.targ: mp, loss1.infonce.tsm.type: linear, name: mp}
    - {loss1.targ: sp, loss1.infonce.tsm.type: linear, name: sp}

hpo_coords:
  - - {opt.lr.init: [2.0e-5, 6.0e-5]}

suffix: null  # {null, [str]}; no suffix if set to null
