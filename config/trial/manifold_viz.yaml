# FROZEN at campaign launch, into artifacts/<campaign>/_phase/screen/cfg_baseline.json --
# edits never reach an existing campaign; every trial of it, original or added later, reads this snapshot.

# Manifold-viz settings that decide what gets COMPUTED and CACHED during/after a trial: whether it runs at all
# (n_seeds), and the projection fits whose output lands in projections.npz / projections_pooled.npz. Changing
# these invalidates those caches, so they are frozen with the campaign; the purely visual settings that re-render
# from the same caches live in config/render/manifold_viz.yaml.

# FROZEN at campaign launch, into artifacts/<campaign>/_phase/screen/cfg_baseline.json --
# edits never reach an existing campaign; every trial of it, original or added later, reads this snapshot.

# Manifold-viz subsystem settings -- whether it runs at all (n_seeds) and how it behaves.

# Which seeds get manifold viz, as a window over each arm/coord/dataset group's seed sweep: a training trial is selected
# iff n_seeds_offset <= idx_seed < n_seeds_offset + n_seeds (the sweep's length is the camp config's n_trials_screen). A
# window the sweep doesn't reach yet is not an error and draws no warning -- those trials simply get no viz, and raising
# the campaign's seed count later brings them into the window as they run. The test phase (test.py) ignores the window
# and vizzes every trial.
n_seeds: 1  # [int] >= 0; How many seeds the window spans; (0) Disables the whole subsystem -- nothing computed,
# cached, or rendered, and the eval embeddings aren't even gathered for viz

n_seeds_offset: 0  # [int] >= 0; Where the window starts; (0) The first seed of every arm/coord/dataset group;
# (1) Skip the first, viz the second; etc.

store_cache: false  # {true, false}; (true) Keep each viz trial's raw per-eval embeddings (eval/all/<k>/viz/cache/
# embs.npz -- the bulk of a viz trial's footprint), the input a REFIT under new tsne.*/umap.* params
# (tools.regen_manifold_viz) reads; (false) The post-trial render worker deletes each eval's embs.npz as the last
# step of a trial's FULL render, once the UMAP fits have consumed it (a partial hand render -- evo_only/no_evo --
# never deletes). The rest of the cache (projections.npz, projections_pooled.npz, orient_ref.pkl -- the fitted 2D
# coords) is kept either way, so stills and GIFs can always be RE-RENDERED under edited render settings; only
# refits need the embeddings. Test trials' eval/sel/viz/cache/ follows the same rule after their stills render

pooled:  # Shared-frame manifold viz: one fit per method on all eval thresholds' embeddings pooled, then each
# threshold plotted as a masked subset of the shared layout (the plot_* flags select the same groups, rendered
# under viz/pooled/, GIFs under viz_dyn/pooled/); Note: (all 3 plot_* flags: false) --> projections still computed + saved
  enabled: true  # {true, false}; (true) Compute the pooled PCA/t-SNE at end-of-trial + the pooled UMAP post-trial,
  # and render the pooled plots; per-eval embeddings are cached either way (the per-eval UMAP fits read them too)
  budget: 100_000  # Pooled point budget as a total sample volume across all thresholds;
  # ((N_id + N_ood) * n_evals <= budget) --> all samples used, otherwise the pool is class-stratified subsampled to
  # ~budget points total; a larger budget costs proportionally more compute -- most sharply for the pooled UMAP,
  # which is a single CPU fit over the whole pool in the render worker
  pca_bounds: final  # {null, final}

tsne:
  perplexity: 30
  n_iter: 1000

umap:  # Fit off the GPU/collective path, in the post-trial render worker, from each eval's cached embs.npz, and
# each eval's fit is initialized from the PREVIOUS eval's layout (which keeps the sequence continuous at the source
# rather than only correcting it afterward with orientation). The cosine metric is fixed in code.
  n_neighbors: 15  # [int] >= 2; Local neighborhood size; smaller --> more local structure, larger --> more global
  min_dist: 0.1  # [0.0, 1.0); Minimum spacing of points in the layout; smaller --> tighter clumps
  n_iter: null  # {null, [int]}; Layout optimization epochs; (null) UMAP's own default (200 for large N, 500 for small)
