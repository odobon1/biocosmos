# READ LIVE at every render -- edits apply to all campaigns, past ones included, from the next
# render on (trial completion, or the tools/regen_*.py re-render).

# Manifold-viz settings that only decide how the cached projections are DRAWN -- no recompute, so editing them
# restyles any campaign's existing viz. What gets computed and cached lives in config/trial/manifold_viz.yaml.

plot_2panel: false   # {true, false}; (true) Plot the per-method leaf/penult pairs
plot_7panel: false   # {true, false}; (true) Plot the per-method 2x4 composites
plot_8panel: true  # {true, false}; (true) Plot the cross-method grids (methods across, colorings down)

orient:  # Cross-eval orientation: every method's layout is aligned to a running reference of per-class CoMs so the
# evolving GIFs don't spin or mirror-flip between evals. t-SNE + UMAP get the full rigid alignment (orthogonal
# Procrustes, rotation + reflection); umap_sphere gets the same alignment solved in SO(3) -- the one rigid motion of
# the whole ball that moves the cluster constellation (seen and unseen clusters alike) the least, so the ball and its
# gridlines stay fixed for the viewer while the clusters glide across them; its first eval starts the largest class
# at the north pole and the second on the central meridian, landmarks later evals are free to drift off; PCA keeps
# its principal axes and only has its per-axis SIGN aligned (the component signs sklearn picks are data-dependent,
# so they flip between evals)
  ema_tau: 0.5  # (0.0, 1.0]; This fraction of the eval's oriented CoMs is mixed into the running reference
  # (=1.0 --> align to the previous eval only, <1.0 --> damps drift across evals)

eval_duration: 1500  # ms each eval is shown in the evolving GIFs (one frame per eval)

bg_color: "#F5F5DC"  # Panel background color in hex format; (null) White. Doubles as the ball color for the
# umap_sphere panels, whose background behind the ball is always white

color:
  seed: 42  # Rotates the whole palette (phase offset); Changes the colors, keeps the count-ordering;
  # Colors are assigned to classes in order of sample count (golden-ratio hue + low-discrepancy
  # vibrancy), so similar-count classes get maximally different colors and near-identical colors
  # only land on classes with very different counts; Each band fixes a "vibrancy" via saturation
  # (0-1, color intensity) and lightness (0-1, darkness->brightness); `weight` is each band's
  # relative share of classes (need not sum to 1); Add/remove/retune bands freely, more bands =
  # more variety
  bands:
    - {weight: 2.0, saturation: 1.00, lightness: 0.50}
    - {weight: 0.7, saturation: 1.00, lightness: 0.30}
    - {weight: 0.7, saturation: 1.00, lightness: 0.70}
    - {weight: 0.5, saturation: 0.55, lightness: 0.50}
    - {weight: 0.2, saturation: 0.45, lightness: 0.60}
    - {weight: 0.3, saturation: 0.45, lightness: 0.40}
    - {weight: 0.5, saturation: 0.50, lightness: 0.80}
