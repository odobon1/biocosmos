# FROZEN at campaign launch, into artifacts/<campaign>/_screen/cfg_baseline.json --
# edits never reach an existing campaign; every trial of it, original or added later, reads this snapshot.

# Loss params: one criterion over the blended target distribution Y = (1 - lambda) * Y1 + lambda * Y2, Yk the
# target distribution of target k (loss1 / loss2) under the criterion -- its target matrix Qk itself for the BCE
# family, Qk through its own target simplex mapping (lossk.infonce.tsm) for InfoNCE
crit: null  # {null, infonce, bce, bif_bce}; (null) Resolved from the model family's default
# (model_specific.yaml: clip -> infonce, siglip -> bce) -- a default only: either family trains under either criterion,
# so a pretrained model can be held fixed across a softmax-vs-sigmoid comparison. The logit bias goes with the
# criterion, not the family: InfoNCE never carries one (a shared scalar cannot move a row softmax; a SigLIP model's
# pretrained bias is dropped), a BCE-family loss always does (loss.logits.bce.bias).
# note: Bifurcated BCE makes the loss reading x2, but other than that it reduces
# to standard BCE (identical gradient flows) if no anchor-wise methods are applied
sim: cos  # {cos, geo1, geo2}
blend:  # Blend of loss1's / loss2's targets, under weights (1 - lambda, lambda)
  lambda: 0.0  # [0.0, 1.0]; loss2's share of the target blend; (0.0) loss1's target alone (loss2 inert); (1.0)
  # loss2's target alone (loss1 inert)
  type: targ  # {targ, loss}; (targ) One loss against the blended target, L(Y); (loss) Blend of the per-target
  # losses, (1 - lambda) * L(Y1) + lambda * L(Y2) -- one criterion, sim and weighting config either way; on shared
  # logit scalars the loss is affine in the target, so the two coincide (value and gradients) unless a
  # target-dependent factor is on: focal / DSMR / targ_mass_neut / infonce.block_residuals then read each term's
  # own target, and unitless rescales each term; Inert iff (loss.blend.lambda: 0.0 | 1.0) or none of
  # (loss.unitless, focal, DSMR, targ_mass_neut, infonce.block_residuals, loss.logits.shared: false) is live
unitless: false  # {true, false}; (true) Rescale each loss term by its detached magnitude, L / L.detach() (bif_bce: by
# L/2, its gradient-scale-equivalent value): a lone term reads a constant 1.0 (bif_bce 2.0), and under blend.type:
# loss the terms are equalized to unit magnitude so lambda is loss2's share of the loss reading -- equivalently (with
# target-independent weights) a target blend under lambda_eff = lambda * L1 / (lambda * L1 + (1 - lambda) * L2),
# logged per batch (general log) and curved in learning_curves/unitless_loss_blend.png (needs
# diagnostics.batch_diagnostics.sim_targ_stats);
# (false) Raw losses
infonce:  # Inert iff (loss.crit != infonce)
  block_residuals: null  # {null, alpha, full}; Block the residual component of the gradient -- both its
  # structural-residual and its irreducible-residual part (utils.loss.infonce_block_resid; the res / ures / ires
  # terms of the dalpha strips): the pressure a target puts on the model by being unreachable is dropped, the
  # pressure the model's own geometry puts on it is kept. (alpha) From the logit scale's gradient alone, so alpha
  # learns from its structural gradient while every other gradient (the towers' included) is untouched; (full)
  # From the whole model's -- the logit scale's and, through the similarities, the towers' -- so the towers and
  # logit scale receive the gradient they would receive against the current reachable optimum p* in place of
  # the target; (null) The full gradient. Applied as a zero-valued correction term, so the loss reading is
  # untouched. Only applies to hard binary targets e.g. SP, MP (FLYP, SupCon), the residual being closed-form
  # there: requires (loss.crit: infonce) with every live target in {sp, mp} under (lossk.infonce.tsm.type: linear),
  # two live ones under (loss.blend.type: loss) -- a target blend of two hard binary targets is not itself hard
  # binary -- and no class-imbalance or focal weighting
bce:  # Inert iff (loss.crit != bif_bce)
  targ_mass_neut: false  # {true, false}; (true) Divide each anchor's row-summed loss by its (blended) target
  # (row) mass; anchor-wise, so bif_bce-only (no-op under sp targets, whose row mass is already 1: inert iff every
  # live target is sp)
wting:
  cls_imb:  # Class-imbalance weighting params; Inert iff (cls_imb.type: null)
    type: null  # {null, inv_freq, class_bal}; (inv_freq) Inverse-frequency; (class_bal) Class-balanced;
    # (null) Disable class-imbalance weighting
    inv_freq:  # Inverse-frequency weighting params; Inert iff (cls_imb.type != inv_freq)
      gamma: 0.5  # (0.0, 1.0]; 1 / n_c^gamma; (1.0) Classic inverse-frequency; (0.5) Inverse-sqrt-frequency;
      # As gamma → 0.0, weights → uniform (no weighting)
    class_bal:  # Class-balanced weighting params; Inert iff (cls_imb.type != class_bal)
      beta: 0.9999  # [0.0, 1.0)
    norm: false  # {true, false}; Rescale the batch's class-imbalance weights to mean 1.0 (weighted loss
    # retains the unweighted scale batch-by-batch rather than in expectation, at the cost of a
    # batch-composition-dependent normalizer); Inert iff (loss.unitless: true)
  focal:  # Focal loss params; Inert if (focal.gamma: 0.0)
    gamma: 0.0  # [0.0, inf); Down-weights easy samples, larger gamma → stronger focus on hard cases; (0.0) Disable
    # focal loss (FL --> CE iff gamma = 0.0); Recommended: 1-2 for InfoNCE, 2 for BCE; (<1.0 | >3.0) May be unstable
  bce:  # BCE-specific weighting params; Inert iff (loss.crit: infonce)
    dsmr: false  # {true, false}; Dynamic similarity mass rebalancing
logits:
  shared: true  # {true, false}; (true) Both loss terms of a loss blend run on one set of logit scalars (scale +
  # bias); (false) Each term on its own pair (loss1: logit_scale / logit_bias, loss2: logit_scale2 / logit_bias2), so
  # each target's loss is scored on its own logits off the one sim matrix -- the pairs share every setting below
  # (the second starts as a copy of the first as initialized: same init, freeze, clamp, center, LR factor) and part
  # ways in training; the scale2 / bias2 curves track the second pair, while the logit-dependent batch diagnostics
  # (P histogram, InfoNCE dalpha / KL / alpha_req, logit grad-norm) read loss1's; Inert iff (loss.blend.type: targ)
  # or (loss.blend.lambda: 0.0 | 1.0) -- a target blend or a lone target is one loss on one set of logits
  scalar_lr_factor: 100.0  # (0.0, inf); LR multiplier for the logit scalars (scale/bias) relative to
  # lr.init (e.g. 10.0 -> x10 backbone LR); ratio held through warmup + cosine decay; scalars are
  # weight-decay-decoupled; (1.0) Backbone LR
  scale:  # logit scale (alpha = 1 / tau), the multiplier on sims; the learnable param (model.logit_scale) is log(alpha)
    init: null  # {null, [float]}; (null) Existing learnable param (or 0.0 non-learnable if non-existent);
    # ([float]) Override init (alpha, not its log); base: (siglip_vitb16: ~117.3), (clip_vitb16: ~100.0);
    # Increasing scale/alpha --> sharper, decreasing --> softer
    freeze: false  # {true, false}; (true) Non-learnable log-scale
    clamp: false  # {true, false}; (true) Cap logit scale at ln(100) before exp() so scale multiplier stays <= 100
    # (CLIP's stability cap; guards exp() overflow + bf16 quantization blowup) -- a held cap passes no gradient to
    # the log-scale (the alpha curve then sits at 100, the dlogalpha strips at zero); (false) Unbounded
  bce:  # Sigmoid/BCE-path logit params; Inert iff (loss.crit: infonce)
    center: null  # {null, sim, grad_proj, grad_proj2}; Make dL/dsim zero-sum; (null) Disabled; (sim) Center
    # scaled sims about their mean before bias -- changes the forward (batch-dependent operating-point shift);
    # (grad_proj) Forward untouched, backward-only global-mean projection of the gradient entering sim (scale AND bias
    # learn from raw BCE grads); (grad_proj2) Same but projected at the scaled sims (bias raw, scale projected);
    # Chunked path (hw.loss_chunk_size) reproduces full-batch centering exactly; (sim) under chunking requires
    # sim: cos (config error otherwise -- no closed-form global mean for geo); sensitive to mixed precision
    bias:
      init: null  # {null, pos_prevalence, [float]}; (null) Use base model bias (or 0.0 non-learnable if non-existent,
      # i.e. a CLIP model under a BCE-family loss);
      # (pos_prevalence) log(p / (1 - p)), p the expected positive prevalence of the blended target matrix under the
      # loss's class-imbalance / DSMR / targ_mass_neut weighting (utils.loss.pos_prevalence; sp: 1/B), so the initial
      # sigmoid matches the target prior where scaled sims average to zero; requires a BCE-family crit; ([float])
      # Override init; base: (siglip_vitb16: -12.9324)
      freeze: false  # {true, false}; (true) Non-learnable bias

loss1:  # Primary target params; Inert iff (loss.blend.lambda: 1.0)
  targ: mp  # {sp, mp, tax, phylo}
  infonce:  # Inert iff (loss.crit != infonce)
    tsm:  # Target Simplex Mapping
      type: linear  # {linear, softmax}
      # (linear) Linear mapping (intended for MP + HCon, linear mapping operation is a no-op for SP (applied regardless))
      # (softmax) Softmax mapping (intended for HCon), targets first scaled by x2 to make alpha_Q comparable to logits' alpha
      # i.e. target range --> similarity range
      sm_scale: pinned  # {pinned, pinned1, pinned3, [float]}
      # (pinned) Target scale alpha_Q pinned to the logits' learnable logit-scale alpha = exp(logit_scale) (targs scaled by x2 first)
      # (pinned1) Same as pinned but without the x2 target scaling
      # (pinned3) Same as pinned but with x3 target scaling
      # ([float]) Fixed alpha_Q (non-learnable), set =0.5 for no target scaling;
      # Inert if (loss.loss1.infonce.tsm.type: linear)

loss2:  # Secondary target params; Inert iff (loss.blend.lambda: 0.0)
  targ: phylo  # {sp, mp, tax, phylo}
  infonce:
    tsm:
      type: softmax  # {linear, softmax}
      sm_scale: pinned  # {pinned, pinned1, pinned3, [float]}
