spread_type: std  # {std, ste}
bold_high: true  # {true, false}; (true) bold item with highest mean per score column
ordered: false  # {true, false}; (true) order each table's rows by its own metric ("All" column for mAP tables, "I2T" for accuracy) -- xlsx sheets by the cross-dataset mean, per-dataset pngs by their own dataset's means; orders may differ between metrics and between tables
heatmap: true  # {true, false}; (true) shade score cells white -> #ff5533 by value over the fixed 0.00 -> 100.00 range
supp_scores:  # supplemental score columns appended right of the composite columns in every score table (pngs + xlsx), in this order
  primitive: true  # {true, false}; (true) per-partition primitive scores -- mAP tables: "ID I2T"/"ID I2I"/"ID T2I"/"OOD I2T"/"OOD I2I"/"OOD T2I"; accuracy tables: "ID I2T"/"OOD I2T"
  n_shot: true  # {true, false}; (true) ID-partition n-shot bucket scores, one column per bucket (split_gen.yaml nst_names, e.g. "few-shot"/"med-shot"/"many-shot") -- mAP tables: the bucket's composite mAP; accuracy tables: its I2T accuracy; "-" where a dataset's eval partition has no classes in the bucket
overrides: true  # {true, false}; (true) append the "Arm Overrides" / "Coord Overrides" config tables to each xlsx sheet (the arms workbooks get the arm table only): one column per param overridden in the campaign's ablation_arms / hpo_coords, values from each row's config.json; params absent there (inert under that config) show "-"
