datasets: [cub, lepid]

n_trials_screen: 1
n_trials_qual: 2  # {null, [int]} >= n_trials_screen; seeds each arm's best coord per dataset is topped up to in the qual phase; (null) no qual phase
trainval: false  # {true, false}; (true) after the qual phase, retrain each pick on the trainval partition up to its qual-selected checkpoint, one run per qual seed, saving the weights (needs n_trials_qual)

ablation_arms:
  - - {arch.model_type: bioclip, name: bioclip}
    - {arch.model_type: siglip_vitb16, name: siggy}
  - - {loss1.targ: phylo, loss1.infonce.tsm.type: softmax, name: HCon}
    - {loss1.targ: mp, loss1.infonce.tsm.type: linear, name: SupCon}
    - {loss1.targ: sp, loss1.infonce.tsm.type: linear, name: FLYP}

hpo_coords:
  - - {opt.lr.init: [6.0e-6, 6.0e-5, 6.0e-4]}
  - - {loss.logits.scale.init: [null, 30, 10]}

suffix: null  # {null, [str]}; no suffix if set to null
