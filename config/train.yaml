split: D10
train_pt: train  # {train, trainval}

n_epochs: 1  # {[int], [float]} > 0; Trial duration in train-set epochs (sample volume = n_epochs * epoch size, where
# epoch size is the batch-truncated train set floor(train_set_size / batch_size) * batch_size
chain_floor: 100_000  # {null, [int]}; Min samples per dataloader pass: when train set < chain_floor, each pass consumes
# ceil(chain_floor / train_set_size) permutations' worth of one continuous stream of full shuffled permutations of the
# train set (partial-batch permutation tails carry into the next pass rather than dropping), decoupling pass length
# (and max batch_size) from dataset size; epochs are credited per pass as ceil(consumed_samples / train_set_size);
# (null | train set >= chain_floor) One pass per epoch
n_chkpts: 10  # Number of train-time checkpoints/evals (final included, base excluded), evenly spaced every
# sample_volume / n_chkpts samples
batch_size: 2_048  # {16, 32, 64, 128, 256, 512, 1_024, 2_048, 4_096, 8_192, 16_384, 32_768}; pretrain batch size for 
# clip_vitb16 and siglip_vitb16 (and perhaps all) was 32k
dv_batching: false  # (true) Dorsal/ventral-homogeneous batch sampling (only applicable to lepid/nymph)

arch:  # Architecture
  model_type: clip_vitb16  # {bioclip, clip_vitb16, siglip_vitb16}
  clip:  # CLIP-specific; Inert iff (arch.model_type: siglip_*)
    non_causal: false  # {true, false}; (true) Converts text encoder causal attention mask to non-causal (zeros on 
    # diagonal + lower triangle, -inf on upper --> all zeros); Base eval: the native causal mask is always restored 
    # (non_causal undone) so the shared base_eval_cache stays a stable pretrained-as-released reference
  siglip:  # SigLIP-specific; Inert iff (arch.model_type: clip_*, bioclip*)
    vis_proj_head: null  # {null, linear, mlp}; Vision projection head over the attention-pooled image representation; 
    # (null) No projection head; (linear) Linear(D->D); (mlp) GeLU-MLP(D->2*D->D); (linear | mlp) Randomly-initialized 
    # params added; Note: this head is always skipped for base model evaluation (headless pretrained output used) so 
    # the shared base_eval_cache stays head-/seed-invariant

dropout:  # Applies only to the vision tower
  patch_dropout: 0.0  # [0.0, 1.0); Fraction of image patches dropped each training step; (0.0) Disabled
  siglip:  # SigLIP-specific params; Inert iff (arch.model_type: [clip model])
    proj_head: 0.0  # [0.0, 1.0); Dropout on the vision projection head; (0.0) Disabled; Inert iff
    # (arch.siglip.vis_proj_head: null)
    stoch_depth: null  # {null, [0.0, 1.0)}; (null) Disabled; ([float]) Stochastic depth / drop-path rate

freeze:
  image: false  # {true, false}
  text: false  # {true, false}

htarg_shuf: false  # {true, false}

loss:  # Primary loss
  crit: infonce  # {infonce, bce, bif_bce}; note: Bifurcated BCE makes the loss reading x2, but other than that it reduces
  # to standard BCE (identical gradient flows) if no anchor-wise methods are applied
  sim: cos  # {cos, geo1, geo2}
  targ: phylo  # {sp, mp, tax, phylo}
  infonce:  # Inert iff (loss.crit != infonce)
    tsm:  # Target Simplex Mapping
      type: softmax  # {linear, softmax}
      # (linear) Linear mapping (intended for MP + HCon, linear mapping operation is a no-op for SP (applied regardless))
      # (softmax) Softmax mapping (intended for HCon), targets first scaled by x2 to make tau_Y comparable to logits' tau
      # i.e. target range --> similarity range
      sm_temp: pinned  # {pinned, pinned1, [float]}
      # (pinned) Use the same learnable logit-scale (log(1 / tau)) as the logits (targs scaled by x2 first)
      # (pinned1) Same as pinned but without the x2 target scaling
      # ([float]) Fixed tau_Y (non-learnable), set =2.0 for no target temperature-scaling; inert if (loss.infonce.tsm.type: linear)
  bce:  # Inert iff (loss.crit != bif_bce)
    targ_mass_neut: false  # {true, false}; (true) Divide each anchor's row-summed loss by its target
    # (row) mass; anchor-wise, so bif_bce-only (no-op under sp targets, whose row mass is already 1); Inert iff (loss.crit != bif_bce)
  wting:
    cls_imb:  # Class-imbalance weighting params; Inert iff (cls_imb.type: null)
      type: null  # {null, inv_freq, class_bal}; (inv_freq) Inverse-frequency; (class_bal) Class-balanced;
      # (null) Disable class-imbalance weighting
      inv_freq:  # Inverse-frequency weighting params; Inert iff (cls_imb.type != inv_freq)
        gamma: 0.5  # (0.0, 1.0]; 1 / n_c^gamma; (1.0) Classic inverse-frequency; (0.5) Inverse-sqrt-frequency;
        # As gamma → 0.0, weights → uniform (no weighting)
      class_bal:  # Class-balanced weighting params; Inert iff (cls_imb.type != class_bal)
        beta: 0.9999  # [0.0, 1.0)
      norm: false  # {true, false}; Rescale the batch's class-imbalance weights to mean 1.0 (weighted loss
      # retains the unweighted scale batch-by-batch rather than in expectation, at the cost of a
      # batch-composition-dependent normalizer); Inert iff (loss2.mix_unit_scale: true AND loss2.mix: >0.0)
    focal:  # Focal loss params; Inert if (focal.gamma: 0.0)
      gamma: 0.0  # [0.0, inf); Down-weights easy samples, larger gamma → stronger focus on hard cases; (0.0) Disable 
      # focal loss (FL --> CE iff gamma = 0.0); Recommended: 1-2 for InfoNCE, 2 for BCE; (<1.0 | >3.0) May be unstable
    bce:  # BCE-specific weighting params; Inert iff (loss.crit: infonce)
      dsmr: false  # {true, false}; Dynamic similarity mass rebalancing
  logits:
    scalar_lr_factor: 100.0  # (0.0, inf); LR multiplier for this loss's logit scalars (temp/bias) relative to
    # opt.lr.init (e.g. 10.0 -> x10 backbone LR); ratio held through warmup + cosine decay; scalars are
    # weight-decay-decoupled; (1.0) Backbone LR
    temp:  # temperature (tau)
      init: null  # {null, [float]}; (null) Existing learnable param (or 0.0 non-learnable if non-existent);
      # ([float]) Override init; base: (siglip_vitb16: ~8.523e-3), (clip_vitb16: ~1.000e-2);
      # Increasing temp/tau --> softer, decreasing --> sharper
      freeze: false  # {true, false}; (true) Non-learnable log-scale
      clamp: false  # {true, false}; (true) Cap logit scale at ln(100) before exp() so scale multiplier stays <= 100
      # (CLIP's stability cap; guards exp() overflow + bf16 quantization blowup); (false) Unbounded
    bce:  # Sigmoid/BCE-path logit params
      center: null  # {null, sim, grad_proj, grad_proj2}; Make dL/dsim zero-sum; (null) Disabled; (sim) Center
      # scaled sims about their mean before bias -- changes the forward (batch-dependent operating-point shift);
      # (grad_proj) Forward untouched, backward-only global-mean projection of the gradient entering sim (temp AND bias
      # learn from raw BCE grads); (grad_proj2) Same but projected at the scaled sims (bias raw, temp projected);
      # Per-criterion (loss2 has its own flag); Chunked path (hw.loss_chunk_size) reproduces full-batch centering
      # exactly; (sim) under chunking requires sim: cos (config error otherwise -- no closed-form global mean for geo);
      # sensitive to mixed precision
      bias:  # Inert iff (loss.crit: infonce)
        init: null  # {null, [float]}; (null) Use base model bias (or 0.0 non-learnable if non-existent);
        # ([float]) Override init; base: (siglip_vitb16: -12.9324)
        freeze: false  # {true, false}; (true) Non-learnable bias

loss2:  # Secondary loss params; Inert iff (loss2.mix: 0.0)
  mix: 0.0  # [0.0, 1.0); (0.0) Disable secondary loss
  mix_unit_scale: false  # {true, false}; (true) Rescale each loss to unit magnitude before blending (a bif_bce
  # participant rescales by L/2, its gradient-scale-equivalent value, keeping mix the true gradient ratio)
  crit: bce  # {infonce, bce, bif_bce}
  sim: cos  # {cos, geo1, geo2}
  targ: phylo  # {sp, mp, tax, phylo}
  infonce:
    tsm:
      type: softmax  # {linear, softmax}
      sm_temp: pinned  # {pinned, pinned1, [float]}
  bce:
    targ_mass_neut: false  # {true, false}; Target mass neutralization
  wting:
    cls_imb:
      type: null  # {null, inv_freq, class_bal}
      inv_freq:
        gamma: 0.5  # (0.0, 1.0]
      class_bal:
        beta: 0.9999  # [0.0, 1.0)
      norm: false  # {true, false}
    focal:
      gamma: 0.0  # [0.0, inf)
    bce:
      dsmr: false  # {true, false}
  logits:
    scalar_lr_factor: 100.0  # (0.0, inf)
    temp:
      init: null  # {null, [float]}
      freeze: false  # {true, false}
      clamp: false  # {true, false}
    bce:
      center: null  # {null, sim, grad_proj, grad_proj2}; Make dL/dsim zero-sum (see loss.logits.bce.center)
      bias:
        init: null  # {null, [float]}
        freeze: false  # {true, false}

aug:  # Image augmentation
  rrcrop:  # Random resized crop
    scale_min: 0.9  # Down-scale wrt area, scale randomly picked from [scale_min, 1.0]; OpenCLIP default: [0.9, 1.0]
  hflip: false  # {true, false}; Horizontal flip w/ 50% probability
  cjit:  # Color jitter
    brightness: 0.1
    contrast: 0.2
    saturation: 0.1
    hue: 0.01
    prob: 0.0
  sharpness:
    factor: 1.333  # (1.0, inf); Sharpness range = [1.0 / factor, factor]; =1.0 --> no change, <1.0 --> reduces 
    # sharpness, >1.0 --> increases sharpness
    prob: 0.00
  gblur:  # Gaussian blur
    kernel_size: 3  # [odd int]
    sigma:
      min: 0.0
      max: 1.0
    prob: 0.00

text_template:
  train: train
  eval: sci  # Following BioCLIP eval protocol

opt:  # Optimization
  lr:  # Learning rate
    init: 1.0e-5
    decay_factor: null  # {null, [float]}; Cosine scheduler eta_min = lr.init * decay_factor; (null) Decay to 0.0
    warmup: 0.05  # [0.0, 1.0]; Linear LR warmup duration as a fraction of sample_volume (e.g. 0.02 -> 2% of sample_volume)
  wd: null  # {null, [float]}; Weight Decay; (null) Resolved from model-specific default hyperparam config
  beta1: 0.9  # CLIP paper recommends 0.9
  beta2: null  # {null, [float]}; (null) Resolved from model-specific default hyperparam config
  eps: 1.0e-6  # CLIP paper recommends 1.0e-6 (ViT)

dev:
  debug_mode: false  # {true, false}
  debug:  # Config overrides applied iff (dev.debug_mode: true)
    n_epochs: 1
    chain_floor: null
    n_chkpts: 2
    batch_size: 256
    opt.lr.warmup: 0.0
  batch_diagnostics: false  # {true, false}; (false) Skip per-batch train diagnostics -- whole-model grad norm,
  # ||delta theta|| update norm (pre-step param snapshot), retained embedding/logit/sim grads + sim-grad sums,
  # and batch sim/targ distribution stats; their log lines and learning-curve panels are omitted
  # (loss/LR/logit-scalar curves and evals unaffected)
  logging: true
  plot_every: chkpt  # {chkpt, trial}; (chkpt) Render learning-curve plots at every checkpoint (incl. base);
  # (trial) Only at the final checkpoint
  continue_campaign: false  # {true, false}; (true) Resume/extend an existing campaign of the same name; (false) If the
  # campaign name (incl. suffix) already has an artifacts dir, fall back to the first free <name>2, <name>3, ... Campaign
  # runner reads this flag from here (not from cfg_baseline.json)
  del_base_eval_cache:
    campaign: true  # {true, false}; (true) Delete base_eval_cache/ once, when the campaign is first created
    # (relaunches keep the cache the campaign's own trials built)
    trial: false  # {true, false}; (true) Delete base_eval_cache/ before each trial launch, so every trial re-runs its 
    # base eval (apples-to-apples wall-clock comparisons)
